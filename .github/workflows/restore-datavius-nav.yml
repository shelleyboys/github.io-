name: Restore Datavius navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-nav:
    if: github.event.head_commit.message != 'Restore Datavius navigation [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Datavius link on site pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = ['index.html', 'darius.html', 'damarius.html', 'demetrus.html', 'datavius.html', 'shop.html']

          for filename in targets:
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              # Only modify the first main navigation block.
              nav_match = re.search(r'<nav>(.*?)</nav>', text, flags=re.IGNORECASE | re.DOTALL)
              if not nav_match:
                  continue
              nav = nav_match.group(0)
              if re.search(r'href=["\']datavius\.html["\']', nav, flags=re.IGNORECASE):
                  continue

              # Insert Datavius immediately after the Da'Marius navigation link.
              pattern = re.compile(
                  r'(<a\s+href=["\']damarius\.html["\'][^>]*>\s*Da[’\']Marius\s*</a>)',
                  flags=re.IGNORECASE | re.DOTALL,
              )
              new_nav, count = pattern.subn(r'\1\n    <a href="datavius.html">Datavius</a>', nav, count=1)
              if count:
                  text = text[:nav_match.start()] + new_nav + text[nav_match.end():]

              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html darius.html damarius.html demetrus.html datavius.html shop.html
          git commit -m "Restore Datavius navigation [skip ci]"
          git push
