<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelley Boys Editor</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 20px;
}

h1 {
    text-align: center;
}

.editor, .output {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

input, textarea, select {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}

button {
    padding: 10px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}

.gallery img {
    width: 200px;
    margin: 5px;
    border-radius: 6px;
}

textarea.outputBox {
    height: 200px;
}

/* Upload box */
.upload-box {
    border: 2px dashed #aaa;
    padding: 20px;
    text-align: center;
    margin-top: 10px;
    background: #fafafa;
    cursor: pointer;
}

.upload-box.dragover {
    border-color: black;
    background: #eee;
}
</style>
</head>

<body>

<h1>Shelley Boys Content Editor</h1>

<div class="editor">
    <h2>Create Article</h2>

    <label>Select Page:</label>
    <select id="person">
        <option value="darius">Darius</option>
        <option value="damarius">Da’Marius</option>
        <option value="demetrus">Demetrus</option>
    </select>

    <input type="text" id="title" placeholder="Article Title">

    <textarea id="description" placeholder="Write description..."></textarea>

    <label>Upload Images:</label>
    <div class="upload-box" id="uploadBox">
        Click or drag images here
        <input type="file" id="imageUpload" accept="image/*" multiple hidden>
    </div>

    <div id="imagePreview" class="gallery"></div>

    <input type="text" id="video" placeholder="YouTube link (optional)">

    <button onclick="generateArticle()">Generate Article</button>
</div>

<div class="output">
    <h2>Preview</h2>
    <div id="preview"></div>

    <h2>Copy This HTML</h2>
    <textarea id="htmlOutput" class="outputBox"></textarea>
</div>

<script>
let uploadedFiles = [];

// Upload box click
document.getElementById("uploadBox").onclick = () => {
    document.getElementById("imageUpload").click();
};

// Handle file selection
document.getElementById("imageUpload").addEventListener("change", handleFiles);

// Drag + drop
let uploadBox = document.getElementById("uploadBox");

uploadBox.addEventListener("dragover", (e) => {
    e.preventDefault();
    uploadBox.classList.add("dragover");
});

uploadBox.addEventListener("dragleave", () => {
    uploadBox.classList.remove("dragover");
});

uploadBox.addEventListener("drop", (e) => {
    e.preventDefault();
    uploadBox.classList.remove("dragover");
    handleFiles({ target: { files: e.dataTransfer.files } });
});

function handleFiles(event) {
    let files = Array.from(event.target.files);

    files.forEach(file => {
        if (!file.type.startsWith("image/")) return;

        uploadedFiles.push(file);

        let reader = new FileReader();
        reader.onload = function(e) {
            let img = document.createElement("img");
            img.src = e.target.result;
            document.getElementById("imagePreview").appendChild(img);
        };
        reader.readAsDataURL(file);
    });
}

// Convert file → base64
function toBase64(file) {
    return new Promise((resolve, reject) => {
        let reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

// Extract YouTube ID safely
function getYouTubeID(url) {
    let regExp = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/;
    let match = url.match(regExp);
    return match ? match[1] : null;
}

async function generateArticle() {
    let title = document.getElementById("title").value;
    let desc = document.getElementById("description").value;
    let video = document.getElementById("video").value;

    let articleHTML = `
<article>
    <h3>${title}</h3>
    <p>${desc}</p>

    <section class="photos">
        <h3>Photo Highlights</h3>
        <div class="gallery">
`;

    // Add images
    for (let file of uploadedFiles) {
        let base64 = await toBase64(file);
        articleHTML += `<img src="${base64}" width="300">\n`;
    }

    // Add YouTube
    let videoId = getYouTubeID(video);
    if (videoId) {
        articleHTML += `
<iframe width="480" height="320"
src="https://www.youtube.com/embed/${videoId}"
frameborder="0" allowfullscreen></iframe>
`;
    }

    articleHTML += `
        </div>
    </section>
</article>
`;

    document.getElementById("preview").innerHTML = articleHTML;
    document.getElementById("htmlOutput").value = articleHTML;
}
</script>

</body>
</html>
